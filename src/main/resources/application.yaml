spring:
  application:
    name: atlasrh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasrh}
    username: ${DB_USERNAME:atlasrh}
    password: ${DB_PASSWORD:atlasrh_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: ${SERVER_PORT:8080}
logging:
  level:
    com.atlasrh: INFO
