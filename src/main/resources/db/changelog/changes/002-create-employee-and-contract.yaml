databaseChangeLog:
  - changeSet:
      id: 002-create-employee
      author: atlasrh
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employee
                    nullable: false
              - column:
                  name: matricule
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
              - column:
                  name: poste
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: manager_id
                  type: BIGINT
        - addUniqueConstraint:
            tableName: employee
            columnNames: matricule
            constraintName: uk_employee_matricule
        - addUniqueConstraint:
            tableName: employee
            columnNames: email
            constraintName: uk_employee_email
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: department_id
            referencedTableName: department
            referencedColumnNames: id
            constraintName: fk_employee_department
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: employee
            baseColumnNames: manager_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_employee_manager
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE employee ADD CONSTRAINT ck_employee_not_own_manager CHECK (manager_id IS NULL OR manager_id <> id)

  - changeSet:
      id: 003-create-contract
      author: atlasrh
      changes:
        - createTable:
            tableName: contract
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_contract
                    nullable: false
              - column:
                  name: contract_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
              - column:
                  name: gross_salary
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: contract
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_contract_employee
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE contract ADD CONSTRAINT ck_contract_valid_type CHECK (contract_type IN ('CDI', 'CDD', 'STAGE'))
        - sql:
            sql: ALTER TABLE contract ADD CONSTRAINT ck_contract_valid_dates CHECK (end_date IS NULL OR end_date >= start_date)
        - sql:
            sql: ALTER TABLE contract ADD CONSTRAINT ck_contract_fixed_term_end_date CHECK (contract_type = 'CDI' OR end_date IS NOT NULL)
        - sql:
            sql: ALTER TABLE contract ADD CONSTRAINT ck_contract_positive_salary CHECK (gross_salary > 0)
  - changeSet:
      id: 004-case-insensitive-unique-fields
      author: atlasrh
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX IF NOT EXISTS uk_department_name_lower ON department (lower(name))
        - sql:
            sql: CREATE UNIQUE INDEX IF NOT EXISTS uk_employee_matricule_lower ON employee (lower(matricule))
        - sql:
            sql: CREATE UNIQUE INDEX IF NOT EXISTS uk_employee_email_lower ON employee (lower(email))
