databaseChangeLog:
  - changeSet:
      id: 001-create-department
      author: atlasrh
      changes:
        - createTable:
            tableName: department
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_department
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
        - addUniqueConstraint:
            tableName: department
            columnNames: name
            constraintName: uk_departments_name



