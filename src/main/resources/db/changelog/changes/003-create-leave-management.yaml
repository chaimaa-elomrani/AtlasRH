databaseChangeLog:
  - changeSet:
      id: 004-create-leave-type
      author: atlasrh
      changes:
        - createTable:
            tableName: leave_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_type
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_leave_type_code
              - column:
                  name: days_per_year
                  type: INT
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE leave_type ADD CONSTRAINT ck_leave_type_valid_code CHECK (code IN ('ANNUAL', 'EXCEPTIONAL'))
        - sql:
            sql: ALTER TABLE leave_type ADD CONSTRAINT ck_leave_type_nonnegative_days CHECK (days_per_year >= 0)

  - changeSet:
      id: 005-create-leave-request
      author: atlasrh
      changes:
        - createTable:
            tableName: leave_request
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_request
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: working_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: decision_comment
                  type: VARCHAR(1000)
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_leave_request_employee
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: leave_type_id
            referencedTableName: leave_type
            referencedColumnNames: id
            constraintName: fk_leave_request_type
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE leave_request ADD CONSTRAINT ck_leave_request_valid_status CHECK (status IN ('PENDING', 'APPROVED', 'REJECTED', 'CANCELLED'))
        - sql:
            sql: ALTER TABLE leave_request ADD CONSTRAINT ck_leave_request_valid_dates CHECK (end_date >= start_date)
        - sql:
            sql: ALTER TABLE leave_request ADD CONSTRAINT ck_leave_request_positive_days CHECK (working_days > 0)
        - createIndex:
            tableName: leave_request
            indexName: ix_leave_request_employee_dates
            columns:
              - column:
                  name: employee_id
              - column:
                  name: start_date
              - column:
                  name: end_date
  - changeSet:
      id: 006-localize-leave-statuses
      author: atlasrh
      changes:
        - sql:
            sql: ALTER TABLE leave_request DROP CONSTRAINT ck_leave_request_valid_status
        - update:
            tableName: leave_request
            columns:
              - column: { name: status, value: EN_ATTENTE }
            where: status = 'PENDING'
        - update:
            tableName: leave_request
            columns:
              - column: { name: status, value: APPROUVEE }
            where: status = 'APPROVED'
        - update:
            tableName: leave_request
            columns:
              - column: { name: status, value: REFUSEE }
            where: status = 'REJECTED'
        - update:
            tableName: leave_request
            columns:
              - column: { name: status, value: ANNULEE }
            where: status = 'CANCELLED'
        - sql:
            sql: ALTER TABLE leave_request ADD CONSTRAINT ck_leave_request_valid_status CHECK (status IN ('EN_ATTENTE', 'APPROUVEE', 'REFUSEE', 'ANNULEE'))
        - sql:
            sql: ALTER TABLE leave_request ALTER COLUMN status SET DEFAULT 'EN_ATTENTE'
  - changeSet:
      id: 007-seed-leave-types
      author: atlasrh
      changes:
        - insert:
            tableName: leave_type
            columns:
              - column: { name: code, value: ANNUAL }
              - column: { name: days_per_year, valueNumeric: 22 }
        - insert:
            tableName: leave_type
            columns:
              - column: { name: code, value: EXCEPTIONAL }
              - column: { name: days_per_year, valueNumeric: 3 }
  - changeSet:
      id: 008-seed-demo-organization
      author: atlasrh
      changes:
        - sql:
            sql: >-
              INSERT INTO department (name, description)
              VALUES ('Direction des ressources humaines', 'Département de démonstration AtlasRH')
              ON CONFLICT (name) DO NOTHING
        - sql:
            sql: >-
              INSERT INTO employee (matricule, first_name, last_name, email, poste, hire_date, department_id)
              SELECT 'ATL-DEMO-MGR', 'Nadia', 'Bennani', 'nadia.bennani@example.test', 'Responsable RH', DATE '2022-04-11', d.id
              FROM department d WHERE d.name = 'Direction des ressources humaines'
              ON CONFLICT (matricule) DO NOTHING
        - sql:
            sql: >-
              INSERT INTO employee (matricule, first_name, last_name, email, poste, hire_date, department_id, manager_id)
              SELECT 'ATL-DEMO-EMP', 'Youssef', 'El Idrissi', 'youssef.elidrissi@example.test', 'Assistant RH', DATE '2024-09-02', d.id, m.id
              FROM department d CROSS JOIN employee m
              WHERE d.name = 'Direction des ressources humaines' AND m.matricule = 'ATL-DEMO-MGR'
              ON CONFLICT (matricule) DO NOTHING
        - sql:
            sql: >-
              INSERT INTO contract (contract_type, start_date, end_date, gross_salary, employee_id)
              SELECT 'CDI', DATE '2024-09-02', NULL, 12500.00, e.id
              FROM employee e WHERE e.matricule = 'ATL-DEMO-EMP'
                AND NOT EXISTS (SELECT 1 FROM contract c WHERE c.employee_id = e.id)
