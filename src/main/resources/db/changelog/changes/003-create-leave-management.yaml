databaseChangeLog:
  - changeSet:
      id: 004-create-leave-type
      author: atlasrh
      changes:
        - createTable:
            tableName: leave_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_type
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_leave_type_code
              - column:
                  name: days_per_year
                  type: INT
                  constraints:
                    nullable: false
        - addCheckConstraint:
            tableName: leave_type
            constraintName: ck_leave_type_valid_code
            constraintBody: code IN ('ANNUAL', 'EXCEPTIONAL')
        - addCheckConstraint:
            tableName: leave_type
            constraintName: ck_leave_type_nonnegative_days
            constraintBody: days_per_year >= 0

  - changeSet:
      id: 005-create-leave-request
      author: atlasrh
      changes:
        - createTable:
            tableName: leave_request
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_leave_request
                    nullable: false
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: leave_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: working_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: decision_comment
                  type: VARCHAR(1000)
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: employee_id
            referencedTableName: employee
            referencedColumnNames: id
            constraintName: fk_leave_request_employee
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: leave_request
            baseColumnNames: leave_type_id
            referencedTableName: leave_type
            referencedColumnNames: id
            constraintName: fk_leave_request_type
            onDelete: RESTRICT
        - addCheckConstraint:
            tableName: leave_request
            constraintName: ck_leave_request_valid_status
            constraintBody: status IN ('PENDING', 'APPROVED', 'REJECTED', 'CANCELLED')
        - addCheckConstraint:
            tableName: leave_request
            constraintName: ck_leave_request_valid_dates
            constraintBody: end_date >= start_date
        - addCheckConstraint:
            tableName: leave_request
            constraintName: ck_leave_request_positive_days
            constraintBody: working_days > 0
        - createIndex:
            tableName: leave_request
            indexName: ix_leave_request_employee_dates
            columns:
              - column:
                  name: employee_id
              - column:
                  name: start_date
              - column:
                  name: end_date
