services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=atlasrh'
      - 'POSTGRES_PASSWORD=atlasrh_dev'
      - 'POSTGRES_USER=atlasrh'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlasrh -d atlasrh']
      interval: 5s
      timeout: 5s
      retries: 10
